[project]
name = "quadra-trainer"
version = "0.1.0"
description = "Automated LoRA fine-tuning on rented GPUs: trainer image agent, cluster orchestrator, mcp-trainer."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
agent = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
qtrain = "orchestrator.cli:main"
mcp-trainer = "mcp_trainer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "agent/trainer_agent", "mcp_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real cloud/provider APIs (needs credentials)"]
