# QLoRA SFT — queer domain, Qwen3.5-4B regime.
# Same notes as the 0.8B regime in this directory (hybrid architecture,
# trust_remote_code, non-thinking chat template). The 4B model halves the
# micro batch and doubles accumulation to keep ~8K tokens/step on 24 GB.
# Launched by src/gpu/axolotl.py run_training(model="Qwen3.5-4B").
base_model: Qwen/Qwen3.5-4B
tokenizer_type: AutoTokenizer
trust_remote_code: true
load_in_4bit: true
strict: false
chat_template: tokenizer_default
datasets:
- path: ./datasets/queer.jsonl
  ds_type: json
  type: chat_template
  field_messages: messages
  roles_to_train: [ "assistant" ]

dataset_prepared_path: ./prepared/
val_set_size: 0.05
output_dir: ./outputs/

sequence_len: 1024
sample_packing: true
pad_to_sequence_len: true

adapter: qlora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true

micro_batch_size: 1
gradient_accumulation_steps: 8

num_epochs: 2

optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 1e-4
warmup_steps: 10

logging_steps: 5
saves_per_epoch: 1
save_total_limit: 2

bf16: auto
tf32: true
gradient_checkpointing: true
flash_attention: false
attn_implementation: sdpa
lora_qkv_kernel: false
lora_mlp_kernel: false
lora_o_kernel: false
lora_embedding_kernel: false

train_on_inputs: false
weight_decay: 0.0
