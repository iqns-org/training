name: postproc-image

# Cost policy: builds fire on p-v* release tags ONLY. Multi-arch:
# arm64 for the local lane (pi00/nano0), amd64 for cloud stage pods
# (RunPod). No cache: torch layers poison gha cache exports (see the
# trainer-image zombie tails) and postproc builds are rare.

on:
  push:
    tags: ["p-v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: postproc-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (arm64 + amd64)
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: images/postproc/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/postproc:${{ github.ref_name }}

      - name: Pin string
        run: |
          echo "Stage jobs launch with:" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "    ghcr.io/${GITHUB_REPOSITORY_OWNER}/postproc@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
