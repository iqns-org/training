name: trainer-image

# Build lane for the generic CUDA trainer image (docs/SPEC.md §3, §10).
# Trigger: tag push (v*) that arrives via the Forgejo → GitHub repo mirror.
# Runs on GitHub's amd64 runners — the only free place a ~20 GB CUDA base
# builds natively. Output is pushed to ghcr.io (cloud-pull mirror); the
# cluster then mirrors ghcr → Forgejo registry (scripts/sync-image.sh) so
# the canonical LAN copy carries the SAME digest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual rebuild of main, tags the artifact 'dev-<sha>'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trainer

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Diagnostics ride in check-run annotations even when GitHub's log
      # blobs 404 (observed twice): emit the base image's toolchain facts.
      - name: Probe base image
        env:
          BASE: axolotlai/axolotl:main-py3.12-cu130-2.13.0
        run: |
          docker pull -q "$BASE"
          out="$(docker run --rm --entrypoint sh "$BASE" -c '
            echo "PATH=$PATH";
            echo "python=$(command -v python) $(python -V 2>&1)";
            echo "VIRTUAL_ENV=${VIRTUAL_ENV:-unset}";
            echo "uv=$(command -v uv || ls /usr/local/bin/uv 2>/dev/null || echo none)";
            (command -v uv || /usr/local/bin/uv) --version 2>/dev/null || true;
            echo "pip=$(python -m pip -V 2>&1 | head -1)";
            ls /workspace/axolotl-venv/bin 2>/dev/null | head -15' 2>&1)"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          echo "$out" | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/trainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin string for ledger / launch specs
        run: |
          echo "Launch pods with:" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "    ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical mirror (same digest) after scripts/sync-image.sh:" >> "$GITHUB_STEP_SUMMARY"
          echo "    pi00.lan:30080/quadra/trainer@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
