name: trainer-image

# Build lane for the generic CUDA trainer image (docs/SPEC.md §3, §10).
#
# COST POLICY (2026-11-23): every minute here is billable and the build pulls
# an ~8 GB base — ONLY tagged releases (v*) build. No workflow_dispatch, no
# PR builders. Diagnostics (the base-image probe) run ONLY on a failed build,
# so green builds never pay for the extra pull.
#
# Flow: tag in Forgejo → repo mirror → here → build linux/amd64 → push
# ghcr.io (cloud mirror). The cluster mirrors the same digest back into the
# Forgejo registry via scripts/sync-image.sh; launch specs pin the digest.

on:
  push:
    tags: ["v*"]

concurrency:  # never run two image builds at once
  group: trainer-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trainer

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/trainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin string for ledger / launch specs
        run: |
          echo "Launch pods with:" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "    ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical copy after scripts/sync-image.sh:" >> "$GITHUB_STEP_SUMMARY"
          echo "    pi00.lan:30080/quadra/trainer@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      # Failure-only diagnostics: raw job logs have 404'd twice, so probe
      # facts are emitted as check-run annotations (API-readable) on red
      # runs only.
      - name: Probe base image (failures only)
        if: failure()
        env:
          BASE: axolotlai/axolotl:main-py3.12-cu130-2.13.0
        run: |
          docker pull -q "$BASE"
          out="$(docker run --rm --entrypoint sh "$BASE" -c '
            echo "PATH=$PATH";
            echo "python=$(command -v python) $(python -V 2>&1)";
            echo "VIRTUAL_ENV=${VIRTUAL_ENV:-unset}";
            echo "uv=$(command -v uv || ls /usr/local/bin/uv 2>/dev/null || echo none)";
            (command -v uv || /usr/local/bin/uv) --version 2>/dev/null || true;
            echo "pip=$(python -m pip -V 2>&1 | head -1)"' 2>&1)"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          echo "$out" | while IFS= read -r l; do echo "::notice::$l"; done
